services:
  db:
    image: postgres:16-bookworm
    profiles: ["db", "heavy"]
    mem_limit: 256m
    memswap_limit: 512m
    command:
      [
        "postgres",
        "-c", "shared_buffers=64MB",
        "-c", "work_mem=4MB",
        "-c", "maintenance_work_mem=32MB",
        "-c", "max_connections=30"
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: qoop-minio:local
    profiles: ["heavy"]
    mem_limit: 256m
    memswap_limit: 512m
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
      GOMEMLIMIT: 200MiB
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  storage-init:
    build: .
    image: qoop-os:local
    profiles: ["heavy"]
    mem_limit: 256m
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
    depends_on: [minio]
    command: ["node", "scripts/init-storage.mjs"]
  migrate:
    build: .
    image: qoop-os:local
    profiles: ["heavy"]
    mem_limit: 384m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed && npx tsx scripts/import-knowledge.ts"]
  analysis-worker:
    build: .
    image: qoop-os:local
    profiles: ["heavy"]
    mem_limit: 384m
    memswap_limit: 640m
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      QOOP_RUNTIME_DIR: /app/.runtime
      OLLAMA_ENDPOINT: http://host.docker.internal:11434
      QOOP_WORKER_PROVIDER: local
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes: ["runtime-data:/app/.runtime"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    command: ["node", "--import", "tsx", "scripts/analysis-worker.ts"]
  app:
    build: .
    image: qoop-os:local
    profiles: ["heavy"]
    mem_limit: 512m
    memswap_limit: 768m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      QOOP_RUNTIME_DIR: /app/.runtime
      QOOP_DESIGNS_DIR: /app/tasarimlar
      NODE_OPTIONS: "--max-old-space-size=384"
    volumes: ["runtime-data:/app/.runtime", "./tasarimlar:/app/tasarimlar"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
volumes:
  postgres-data:
  minio-data:
  runtime-data:
